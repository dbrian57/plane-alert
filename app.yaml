name: plane-alert
region: nyc
workers:
  - name: poller
    dockerfile_path: Dockerfile
    source_dir: /
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: HOME_LAT
        value: "REPLACE_ME"
      - key: HOME_LON
        value: "REPLACE_ME"
      - key: RADIUS_MILES
        value: "1.0"
      - key: POLL_INTERVAL_SECONDS
        value: "15"
      - key: COOLDOWN_MINUTES
        value: "20"
      - key: DB_PATH
        value: "/tmp/plane_alert.db"
      - key: ADSBX_API_KEY
        type: SECRET
        value: "REPLACE_ME"
      - key: ADSBX_HOST
        value: "adsbexchange-com1.p.rapidapi.com"
      - key: TWILIO_ACCOUNT_SID
        type: SECRET
        value: "REPLACE_ME"
      - key: TWILIO_AUTH_TOKEN
        type: SECRET
        value: "REPLACE_ME"
      - key: TWILIO_FROM_NUMBER
        value: "REPLACE_ME"
      - key: TWILIO_TO_NUMBER
        value: "REPLACE_ME"
